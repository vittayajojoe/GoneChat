<!DOCTYPE html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GoneChat — คุยเสร็จ หายไป (Chat. Then Gone.)</title>
    <meta name="description" content="แพลตฟอร์มแชทชั่วคราว ไม่เก็บประวัติถาวร ข้อความอยู่ใน RAM แล้วสลายไปทันที" />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Google Sans Text & Noto Sans Thai Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-dark-900 text-slate-100 min-h-screen antialiased selection:bg-rose-500 selection:text-white font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration skipped', err);
          });
        });
      }
    </script>
  </body>
</html>
