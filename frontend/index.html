<!DOCTYPE html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GoneChat — Chat. Then Gone.</title>
    <meta name="description" content="Temporary chat platform without persistent history. Chat in RAM, then gone forever." />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body class="bg-dark-900 text-slate-100 min-h-screen antialiased selection:bg-rose-500 selection:text-white">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration skipped', err);
          });
        });
      }
    </script>
  </body>
</html>
